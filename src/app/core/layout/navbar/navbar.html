
<header class="top-nav" [class.top-nav-compact]="navbarCompact()">
  <div class="top-nav-inner">
    <button class="brand">
      <span class="brand-mark">
        <icon-player-circle [size]="22"></icon-player-circle>
      </span>
      <span class="brand-text">
        <h3>Cine<span>Pick</span></h3>
      </span>
    </button>

    <!-- <nav class="desktop-links" aria-label="Main navigation">
      @for (link of navLinkIds; track link.id) {
        <button
          type="button"
          class="desktop-link"
          [class.desktop-link-active]="isNavActive(link.id)"
          (click)="scrollTo(link.id)"
        >
          {{ 'nav.' + link.id | transloco }}
        </button>
      }
    </nav> -->

    <div class="top-tools">
      <!-- <button type="button" class="tool-btn" (click)="toggleLang()">
        {{ langSvc.isEnglish() ? 'PT' : 'EN' }}
      </button> -->
      @if (searchOpenBar()) {
          <label class="search-pill" aria-label="Search titles">
            <app-icon-search [size]="16"></app-icon-search>
            <input
              type="text"
              [value]="searchValue()"
              placeholder="Search titles..."
            />
            <button type="button" class="tool-btn" (click)="closeSearchBar()">
              <app-close-icon [size]="16"></app-close-icon>
            </button>
          </label>
      } @else {
        <button
        type="button"
        class="tool-btn"
        (click)="toggleSearchBar()"
        aria-label="Open search">
          <app-icon-search [size]="16"></app-icon-search>
        </button>
      }

      <button
        type="button"
        class="tool-btn tool-btn-notification" aria-label="Notifications"
        >
      </button>
      <button type="button" class="avatar" aria-label="Profiles">
          <app-user-icon [size]="16"></app-user-icon>
      </button>
    </div>
  </div>
</header>
