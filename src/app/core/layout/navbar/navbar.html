
<header class="top-nav" [class.top-nav-compact]="navbarCompact()">
  <div class="top-nav-inner">
    <button class="brand">
      <span class="brand-mark">
        <icon-player-circle [size]="22"></icon-player-circle>
      </span>
      <span class="brand-text">
        <h3>Cine<span>Pick</span></h3>
      </span>
    </button>

    <div class="top-tools">
      <div class="language-switcher" role="group" aria-label="Change language">
        <button
          type="button"
          class="language-option"
          [class.language-option-active]="!langSvc.isEnglish()"
          [attr.aria-pressed]="!langSvc.isEnglish()"
          (click)="setLanguage('pt-BR')"
        >
          PT
        </button>
        <button
          type="button"
          class="language-option"
          [class.language-option-active]="langSvc.isEnglish()"
          [attr.aria-pressed]="langSvc.isEnglish()"
          (click)="setLanguage('en')"
        >
          EN
        </button>
      </div>
    </div>
  </div>
</header>
