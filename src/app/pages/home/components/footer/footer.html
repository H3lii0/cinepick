<footer class="footer frame">
	<div class="footer-top">
		<div class="footer-brand">
			<span class="brand-mark"></span>
			<div>
				<h3>Cine<span>Pick</span></h3>
				<p>{{ 'footer.tagline' | transloco }}</p>
			</div>
		</div>

		<div class="footer-links">
			@for (key of ['about', 'privacy', 'terms', 'contact', 'help']; track key) {
				<button type="button">{{ 'footer.' + key | transloco }}</button>
			}
		</div>
	</div>

	<div class="footer-bottom">
		<p>{{ 'footer.copyright' | transloco }}</p>
		<div>
			<span>{{ 'footer.disclaimer' | transloco }}</span>
			<span class="dot"></span>
			<span>{{ 'footer.poweredBy' | transloco }}</span>
		</div>
	</div>
</footer>
