<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b3cf5"/>
      <stop offset="100%" stop-color="#f43fa0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo com glow -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none"
        stroke="url(#borderGradient)" stroke-width="6" filter="url(#glow)"/>

  <!-- Borda nítida por cima -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#0d0d1b"
        stroke="url(#borderGradient)" stroke-width="4"/>

  <!-- Triângulo de play -->
  <path d="M50 40.5v47c0 3.6 3.9 5.8 7 4.2l38-23.5a4.8 4.8 0 0 0 0-8.4l-38-23.5c-3.1-1.6-7 .6-7 4.2z"
        fill="#ffffff"/>
</svg>
